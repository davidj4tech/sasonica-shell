name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  portability:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install jq coreutils openssl@3 python
          echo "$(brew --prefix)/opt/coreutils/libexec/gnubin" >> "$GITHUB_PATH"
          echo "$(brew --prefix)/opt/openssl@3/bin" >> "$GITHUB_PATH"
      - name: Shell syntax (system Bash)
        run: |
          /bin/bash -n install.sh
          /bin/bash -n tests/check-signing.sh
      - name: Signing compatibility
        run: /bin/bash tests/check-signing.sh
      - name: Installer and process behavior
        run: python3 tests/check-platform.py
      - name: Installer decisions
        run: node tests/check-install.mjs
      - name: Worker runner API
        run: node --experimental-strip-types --experimental-sqlite --no-warnings tests/check-worker.mjs
      - name: Hosted relay (tenants kept apart)
        run: node --experimental-strip-types --experimental-sqlite --no-warnings tests/check-relay.mjs
      - name: Worker OAuth
        run: |
          npm ci --prefix worker --no-audit --no-fund
          node --experimental-strip-types --experimental-sqlite --no-warnings tests/check-oauth.mjs
      - name: Runner behavior
        run: node --experimental-strip-types --experimental-sqlite --no-warnings tests/check-runner.mjs

  # The same runner, on the platform whose OS plumbing -- taskkill,
  # powershell.exe, %LOCALAPPDATA% -- no POSIX run reaches. A detached-spawn
  # bug made every Windows job report success having run nothing, and only a
  # real Windows run could see it.
  windows-runner:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer decisions on Windows
        run: node tests/check-install.mjs
      - name: Runner behavior on Windows
        run: node --experimental-strip-types --experimental-sqlite --no-warnings tests/check-runner.mjs
      - name: Windows installer helpers
        # Windows PowerShell 5.1, which is what ships on the machine, not pwsh 7.
        shell: powershell
        run: .\tests\check-windows-install.ps1
